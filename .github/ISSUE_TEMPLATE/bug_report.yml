name: Bug report
description: Report a reproducible Starcat Alfred Workflow problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include pairing URIs, tokens, private repository data, notes, or local paths.
  - type: input
    id: workflow-version
    attributes:
      label: Workflow version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS version, Alfred version, Starcat version, starcat CLI version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
